name: Selenium Test Automation

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Build Project
        run: mvn clean compile

      - name: Execute TestNG Tests
        run: mvn test -DsuiteXmlFile=testng.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestReports
          path: |
            test-output/**
            src/test/resources/testOutput/**
