name: Selenium CI

on:

  push:

    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Build
        run: mvn clean compile

      - name: Execute Tests
        run: mvn test -DsuiteXmlFile=testng.xml -Dheadless=true

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()

        with:
          name: TestReports
          path: src/test/resources/testOutput/
